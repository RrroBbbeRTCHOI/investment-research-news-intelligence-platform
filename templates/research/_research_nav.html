<nav class="research-navigation" data-component="research-navigation" data-active-tab="{{ active_tab }}" aria-label="Research sections"><span class="breadcrumb"><b>{{ selected_ticker }}</b> / Research</span>{% for id,label in dossier.sections %}<a href="{{ url_for('research',ticker=selected_ticker,tab='sec-filing' if id=='sec-filings' else id) }}#{{ id }}" data-section-link="{{ id }}" {% if id == ('sec-filings' if active_tab=='sec-filing' else active_tab) %}aria-current="location"{% endif %}>{{ label }}</a>{% endfor %}</nav>
